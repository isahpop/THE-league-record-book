name: Validate THE League site

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run record-book integrity tests
        run: |
          node --test tests/*.test.js
          python -m unittest discover -s tests -p 'test_*.py' 

      - name: Verify required site files
        run: |
          test -f index.html
          test -f assets/app.js
          test -f assets/stats.js
          test -f assets/styles.css
          test -f assets/pulse.js
          test -f assets/pulse.css
          test -f assets/preview.js
          test -f assets/preview.css
          test -f scripts/publish_recap.py
          test -f scripts/sync_espn.py
          test -f tests/preview.test.js
          test -f tests/test_publishing.py
          test -f tests/stats.test.js
          test -f tests/pulse.test.js
          test -f data/managers.json
          test -f data/history.json
          test -f data/season-2026.json
          test -f data/records.json
          test -f data/recaps.json
          test -f data/awards.json
