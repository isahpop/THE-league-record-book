name: Sync ESPN league data

on:
  # Publish a fresh snapshot as soon as a sync/import repair reaches main.
  # Bot-generated data commits use GITHUB_TOKEN and do not recursively trigger this.
  push:
    branches: [main]
    paths:
      - 'scripts/sync_espn.py'
      - 'scripts/publish_recap.py'
      - 'tests/**'
      - '.github/workflows/sync-espn.yml'
  workflow_dispatch:
    inputs:
      publish_recaps:
        description: 'Backfill missing weekly recaps now (after ESPN sync)'
        required: false
        type: boolean
        default: false
  schedule:
    # Regular sync, plus faster refreshes during NFL game windows (UTC).
    - cron: '17 */6 * 9-12 *'
    - cron: '*/15 16-23 * 9-12 0'
    - cron: '*/15 0-5 * 9-12 1'
    - cron: '*/15 0-5 * 9-12 2,5'
    # Tuesday morning CT: covers daylight and standard time for recap release.
    - cron: '12 13,14 * 9-12 2'
    # Thursday daytime CT: refresh the upcoming matchup preview.
    - cron: '15 17,18 * 9-12 4'

permissions:
  contents: write

concurrency:
  group: espn-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pull THE League directly from ESPN
        env:
          ESPN_LEAGUE_ID: '1838057056'
          ESPN_SEASON: '2026'
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: python scripts/sync_espn.py
      - name: Publish missing weekly recaps after Tuesday 8 AM Central
        env:
          PUBLISH_NOW: ${{ inputs.publish_recaps || 'false' }}
        run: |
          LOCAL_DOW=$(TZ=America/Chicago date +%u)
          LOCAL_HOUR=$(TZ=America/Chicago date +%H)
          if [[ "$PUBLISH_NOW" == "true" ]] || { [[ "$LOCAL_DOW" == "2" ]] && (( 10#$LOCAL_HOUR >= 8 )); }; then
            python scripts/publish_recap.py
          else
            echo 'Not the Tuesday recap window; preserving archived columns.'
          fi
      - name: Run integrity tests
        run: |
          node --test tests/*.test.js
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit refreshed public data
        run: |
          if git diff --quiet -- data/; then
            echo 'No league-data changes.'
            exit 0
          fi
          git config user.name 'THE League Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/
          git commit -m 'Auto-sync ESPN data and weekly league content'
          git push
